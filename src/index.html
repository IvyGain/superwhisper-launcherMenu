<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superwhisper Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Superwhisper Launcher</h1>
            <div class="controls">
                <span class="shortcuts-hint">Cmd+1-9 で直接起動</span>
                <button class="settings-btn" onclick="openSettings()">⚙️</button>
                <button class="close-btn" onclick="closeApp()">×</button>
            </div>
        </div>
        
        <div class="modes-grid" id="modesGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>モードを読み込み中...</p>
            </div>
        </div>
        
        <div class="footer">
            <div class="help-text">
                <span id="helpText">クリックでモード起動 • ドラッグ&ドロップで順序変更 • ESCで閉じる • Option+V/Cmd+Shift+Wで再表示</span>
            </div>
        </div>
        
        <!-- リサイズハンドル -->
        <div class="resize-handle"></div>
    </div>

    <!-- 設定モーダル -->
    <div class="modal" id="settingsModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>設定</h2>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3>⌨️ ショートカット設定</h3>
                    <div class="shortcut-settings">
                        <div class="shortcut-item">
                            <label>ランチャーを開く:</label>
                            <div class="shortcut-input-group">
                                <input type="text" class="shortcut-input" value="Option+V" readonly>
                                <button class="shortcut-change-btn">変更</button>
                            </div>
                        </div>
                        <div class="shortcut-item">
                            <label>ProcessAgain:</label>
                            <div class="shortcut-input-group">
                                <input type="text" class="shortcut-input" value="Option+P" readonly>
                                <button class="shortcut-change-btn">変更</button>
                            </div>
                        </div>
                        <div class="shortcut-item">
                            <label>Cmd+1-9ショートカット:</label>
                            <div class="shortcut-input-group">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="numberShortcutsToggle" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="toggle-label">有効</span>
                            </div>
                        </div>
                        <div class="shortcut-fixed">
                            <span class="key-badge">ESC</span> - ランチャーを閉じる
                        </div>
                    </div>
                </div>
                <div class="settings-section collapsible">
                    <h3 class="collapsible-header">🎨 アイコン＆ホットキー設定 <span class="collapse-arrow">▼</span></h3>
                    <div class="collapsible-content">
                        <div id="iconSettings" class="icon-settings">
                            <!-- アイコン＆ホットキー設定がここに動的に追加される -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
