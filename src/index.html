<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superwhisper Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left"></div>
            
            <div class="header-center">
                <div class="app-info">
                    <span class="app-icon">🎤</span>
                    <span class="app-title">Superwhisper Launcher</span>
                </div>
            </div>
            
            <div class="header-right">
                <div class="shortcuts-hint" id="shortcutsHint" style="display: none;">Cmd+1-9 で直接起動</div>
                <button class="settings-btn" onclick="openSettings()">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 10C9.10457 10 10 9.10457 10 8C10 6.89543 9.10457 6 8 6C6.89543 6 6 6.89543 6 8C6 9.10457 6.89543 10 8 10Z" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M13.7 8C13.7 8.3 13.68 8.59 13.64 8.87L15.27 10.14C15.42 10.26 15.46 10.48 15.37 10.65L13.84 13.35C13.74 13.53 13.52 13.59 13.34 13.53L11.37 12.71C10.96 13.02 10.5 13.27 10.01 13.44L9.7 15.51C9.66 15.7 9.5 15.85 9.3 15.85H6.24C6.04 15.85 5.88 15.7 5.84 15.51L5.53 13.44C5.04 13.27 4.58 13.02 4.17 12.71L2.2 13.53C2.02 13.59 1.8 13.53 1.7 13.35L0.17 10.65C0.07 10.47 0.12 10.25 0.27 10.14L1.9 8.87C1.86 8.59 1.84 8.3 1.84 8C1.84 7.7 1.86 7.41 1.9 7.13L0.27 5.86C0.12 5.74 0.08 5.52 0.17 5.35L1.7 2.65C1.8 2.47 2.02 2.41 2.2 2.47L4.17 3.29C4.58 2.98 5.04 2.73 5.53 2.56L5.84 0.49C5.88 0.3 6.04 0.15 6.24 0.15H9.3C9.5 0.15 9.66 0.3 9.7 0.49L10.01 2.56C10.5 2.73 10.96 2.98 11.37 3.29L13.34 2.47C13.52 2.41 13.74 2.47 13.84 2.65L15.37 5.35C15.47 5.53 15.42 5.75 15.27 5.86L13.64 7.13C13.68 7.41 13.7 7.7 13.7 8Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="modes-grid" id="modesGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p id="loadingText">モードを読み込み中...</p>
            </div>
        </div>
        
        <div class="footer">
            <div class="help-text">
                <span id="helpText">クリックでモード起動 • ドラッグ&ドロップで順序変更 • ESCで閉じる • Option+V/Cmd+Shift+Wで再表示</span>
            </div>
        </div>
        
        <!-- リサイズハンドル -->
        <div class="resize-handle"></div>
    </div>

    <!-- 設定モーダル -->
    <div class="modal" id="settingsModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="settingsTitle">設定</h2>
                <button class="modal-close-btn" onclick="closeSettings()">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.5 3.5L3.5 10.5M3.5 3.5L10.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3 id="shortcutSettingsTitle">⌨️ ショートカット設定</h3>
                    <div class="shortcut-settings">
                        <div class="shortcut-item">
                            <label id="launcherLabel">ランチャーを開く:</label>
                            <div class="shortcut-input-group">
                                <input type="text" class="shortcut-input" value="Option+V" readonly>
                                <button class="shortcut-change-btn" id="changeBtn1">変更</button>
                            </div>
                        </div>
                        <div class="shortcut-item">
                            <label id="processAgainLabel">ProcessAgain:</label>
                            <div class="shortcut-input-group">
                                <input type="text" class="shortcut-input" value="Option+P" readonly>
                                <button class="shortcut-change-btn" id="changeBtn2">変更</button>
                            </div>
                        </div>
                        <div class="shortcut-item">
                            <label id="numberShortcutsLabel">Cmd+1-9ショートカット:</label>
                            <div class="shortcut-input-group">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="numberShortcutsToggle" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="toggle-label" id="enabledLabel">有効</span>
                            </div>
                        </div>
                        <div class="shortcut-fixed">
                            <span class="key-badge">ESC</span> <span id="escDescription">- ランチャーを閉じる</span>
                        </div>
                    </div>
                </div>
                <div class="settings-section">
                    <h3 id="languageTitle">🌐 言語設定</h3>
                    <div class="language-settings">
                        <div class="language-item">
                            <label id="currentLanguageLabel">現在の言語:</label>
                            <div class="language-input-group">
                                <select id="languageSelect" class="language-select">
                                    <option value="ja">日本語</option>
                                    <option value="en">English</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="settings-section collapsible">
                    <h3 class="collapsible-header" id="iconHotkeyTitle">🎨 アイコン＆ホットキー設定 <span class="collapse-arrow">▼</span></h3>
                    <div class="collapsible-content">
                        <div id="iconSettings" class="icon-settings">
                            <!-- アイコン＆ホットキー設定がここに動的に追加される -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
